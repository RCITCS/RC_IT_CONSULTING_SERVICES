name: Admin Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/admin-only.js'
      - 'worker/admin-responsive.js'
      - 'src/backend/runtime/**'
      - 'cloudflare/admin-production/**'
      - '.github/workflows/admin-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcitcs-admin-production-deploy
  cancel-in-progress: true

jobs:
  deploy-admin-production:
    name: Deploy rcitcs-admin-production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Report Cloudflare credential availability
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo 'token_available=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare API token is available to this workflow.'
          else
            echo 'token_available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions, so direct admin Worker deployment cannot run.'
          fi

          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo 'account_available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'account_available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::CLOUDFLARE_ACCOUNT_ID is not configured. Wrangler may still infer the account when the token has access to only one account.'
          fi

      - name: Deploy isolated production admin Worker
        if: steps.credentials.outputs.token_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.0 deploy --config cloudflare/admin-production/wrangler.jsonc

      - name: Verify live admin GET, responsive marker and WebKit POST fallback
        if: steps.credentials.outputs.token_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ADMIN='https://admin.rcitcs.com'

          for attempt in $(seq 1 30); do
            code=$(curl -sS -D /tmp/admin.headers -o /tmp/admin.html -w '%{http_code}' "${ADMIN}/" || true)
            if [[ "$code" == '200' ]] \
              && grep -q 'Administrator sign in' /tmp/admin.html \
              && grep -q 'data-rc-admin-responsive' /tmp/admin.html; then
              echo "Updated admin Worker observed on attempt ${attempt}."
              break
            fi
            if [[ "$attempt" == '30' ]]; then
              echo 'Updated admin Worker did not become visible in time.' >&2
              exit 1
            fi
            sleep 4
          done

          tr -d '\r' < /tmp/admin.headers | grep -qi '^cache-control:.*no-store'
          tr -d '\r' < /tmp/admin.headers | grep -qi '^x-robots-tag:.*noindex'
          tr -d '\r' < /tmp/admin.headers | grep -qi '^x-frame-options: *DENY'

          compatible_code=$(curl -sS -o /tmp/mobile-compatible.html -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=not-the-admin%40example.invalid' \
            "${ADMIN}/forgot-password")
          test "$compatible_code" = '200'
          grep -q 'If the account is eligible' /tmp/mobile-compatible.html

          rejected_code=$(curl -sS -o /tmp/mobile-cross-origin.txt -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://example.invalid' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=not-the-admin%40example.invalid' \
            "${ADMIN}/forgot-password")
          test "$rejected_code" = '403'
          grep -q 'Request rejected' /tmp/mobile-cross-origin.txt

          echo 'Production admin Worker, responsive delivery and iPhone/iPad POST compatibility verified live.'

      - name: Record non-deployment when Cloudflare credential is unavailable
        if: steps.credentials.outputs.token_available != 'true'
        run: |
          echo 'Admin production deployment was not attempted because GitHub does not currently expose CLOUDFLARE_API_TOKEN to this repository.'
          echo 'Source, tests and Wrangler bundles remain verified, but production is intentionally not reported as updated.'
