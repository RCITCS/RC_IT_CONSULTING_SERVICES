name: Phase 13 Secret Availability

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    name: Check existing Phase 13 secret availability
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RESEND_API_KEY:-}" ]]; then
            echo 'RESEND_API_KEY_PRESENT=true'
          else
            echo 'RESEND_API_KEY_PRESENT=false'
          fi
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'SUPABASE_ACCESS_TOKEN_PRESENT=true'
          else
            echo 'SUPABASE_ACCESS_TOKEN_PRESENT=false'
          fi
