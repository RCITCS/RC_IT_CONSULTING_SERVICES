name: Phase 13 Email Runtime Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transactional-email-runtime:
    name: Verify transactional email health and auth boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify provider and database runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chsizmffzpxcqhaptjeu.supabase.co/functions/v1/transactional-email'
          code=$(curl -sS -o /tmp/phase13-health.json -w '%{http_code}' "${BASE}/health")
          test "$code" = '200'
          grep -q '"ok":true' /tmp/phase13-health.json
          grep -q '"service":"rcitcs-transactional-email"' /tmp/phase13-health.json
          grep -q '"contract":"phase13-admin-reset-v1"' /tmp/phase13-health.json
          grep -q '"provider":"resend"' /tmp/phase13-health.json
          grep -q '"providerConfigured":true' /tmp/phase13-health.json
          grep -q '"databaseConfigured":true' /tmp/phase13-health.json

      - name: Verify dispatch rejects unauthenticated callers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chsizmffzpxcqhaptjeu.supabase.co/functions/v1/transactional-email'
          code=$(curl -sS -o /tmp/phase13-unauthorized.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"emailLogId":"11111111-1111-4111-8111-111111111111"}' \
            "${BASE}/dispatch")
          test "$code" = '401'
          grep -q '"code":"UNAUTHORIZED"' /tmp/phase13-unauthorized.json

          echo 'Phase 13 transactional email runtime configuration and internal-auth boundary verified.'
