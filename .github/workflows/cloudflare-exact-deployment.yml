name: Cloudflare Exact Deployment Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-exact-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-production:
    name: Verify exact main SHA and Phase 12 production boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for exact main commit to reach the public production Worker
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE='https://rcitcs.com'

          for attempt in $(seq 1 72); do
            code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' "${BASE}/" || true)
            if [[ "$code" == '200' ]] \
              && grep -Fq "name=\"rc-deployment-sha\" content=\"${EXPECTED_SHA}\"" /tmp/root.html \
              && grep -q 'data-prerendered-path="/"' /tmp/root.html \
              && grep -q 'application/ld+json' /tmp/root.html \
              && grep -q 'Technology that' /tmp/root.html \
              && ! grep -q 'Administrator sign in' /tmp/root.html; then
              echo "Exact main SHA ${EXPECTED_SHA} is live on rcitcs.com."
              break
            fi

            if [[ "$attempt" == '72' ]]; then
              echo "rcitcs.com did not expose exact main SHA ${EXPECTED_SHA} within the verification window." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify Phase 12 Careers, application and SEO boundaries on production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rcitcs.com'

          require_match() {
            local label="$1" pattern="$2" file="$3"
            if ! grep -q "$pattern" "$file"; then
              echo "Missing expected production boundary: ${label}" >&2
              exit 1
            fi
          }

          reject_match() {
            local label="$1" pattern="$2" file="$3"
            if grep -q "$pattern" "$file"; then
              echo "Unexpected production boundary content: ${label}" >&2
              exit 1
            fi
          }

          curl -L -sS "${BASE}/careers/jobs/senior-data-engineer" -o /tmp/job.html
          require_match 'job page index directive' 'name="robots" content="index,follow"' /tmp/job.html
          require_match 'runtime job marker' 'data-runtime-job-posting' /tmp/job.html
          require_match 'JobPosting structured data' '"@type":"JobPosting"' /tmp/job.html
          require_match 'directApply structured data' '"directApply":true' /tmp/job.html
          require_match 'application link' 'href="/careers/jobs/senior-data-engineer/apply"' /tmp/job.html

          curl -L -sS "${BASE}/careers/jobs/senior-data-engineer/apply" -o /tmp/apply.html
          require_match 'candidate application form' 'data-career-application' /tmp/apply.html
          require_match 'application noindex directive' 'name="robots" content="noindex,nofollow"' /tmp/apply.html
          reject_match 'JobPosting marker on application page' 'data-runtime-job-posting' /tmp/apply.html
          reject_match 'Supabase secret variable name in application page' 'SUPABASE_SECRET_KEY' /tmp/apply.html
          reject_match 'Supabase secret value prefix in application page' 'sb_secret_' /tmp/apply.html

          curl -L -sS "${BASE}/sitemap.xml" -o /tmp/sitemap.xml
          require_match 'published vacancy in runtime sitemap' '/careers/jobs/senior-data-engineer</loc>' /tmp/sitemap.xml
          reject_match 'application URL in sitemap' '/apply</loc>' /tmp/sitemap.xml

          health_code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' "${BASE}/api/health")
          test "$health_code" = '200'
          require_match 'public API health' '"ok":true' /tmp/health.json

          echo 'Phase 12 public Careers, JobPosting, application noindex, runtime sitemap and API health verified.'

      - name: Wait for exact main commit to reach dedicated admin production Worker
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ADMIN='https://admin.rcitcs.com'

          for attempt in $(seq 1 120); do
            admin_code=$(curl -sS -D /tmp/admin.headers -o /tmp/admin.html -w '%{http_code}' "${ADMIN}/" || true)
            deployed_sha=$(awk -F': *' 'tolower($1)=="x-rc-admin-deployment-sha" {gsub(/\r/,"",$2); print tolower($2)}' /tmp/admin.headers 2>/dev/null | tail -n1)
            if [[ "$admin_code" == '200' && "$deployed_sha" == "$EXPECTED_SHA" ]] \
              && grep -q 'Administrator sign in' /tmp/admin.html \
              && grep -q 'Private administration for controlled operational work.' /tmp/admin.html \
              && ! grep -q 'Technology that' /tmp/admin.html \
              && ! grep -q '/functions/v1/admin-auth' /tmp/admin.html \
              && grep -qi '^x-rc-admin-edge-release: *phase12-job-authoring-v1' /tmp/admin.headers \
              && grep -qi '^x-rc-admin-build-surface: *phase16-security-closure-v1' /tmp/admin.headers \
              && grep -qi '^x-rc-admin-environment: *production' /tmp/admin.headers \
              && grep -qi '^cache-control:.*no-store' /tmp/admin.headers \
              && grep -qi '^x-robots-tag:.*noindex' /tmp/admin.headers; then
              break
            fi

            if [[ "$attempt" == '120' ]]; then
              echo "Dedicated admin production Worker did not converge to exact main SHA ${EXPECTED_SHA}; observed ${deployed_sha:-missing}." >&2
              exit 1
            fi
            sleep 5
          done

          session_code=$(curl -sS -D /tmp/session.headers -o /tmp/session.json -w '%{http_code}' "${ADMIN}/session")
          test "$session_code" = '401'
          grep -q '"authenticated":false' /tmp/session.json
          grep -qi "^x-rc-admin-deployment-sha: *${EXPECTED_SHA}" /tmp/session.headers

          echo "Exact main SHA ${EXPECTED_SHA} and production-admin session boundary verified."
