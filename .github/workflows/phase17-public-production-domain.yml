name: Phase 17.2 Public Production Domain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-public-production-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-production-domain:
    name: Verify rcitcs.com authoritative public production surface
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Phase 17.2 source ownership contract
        run: node tests/phase17-public-production-domain.mjs

      - name: Build production public artifacts for the candidate source
        env:
          WORKERS_CI_BRANCH: main
        run: npm run build

      - name: Verify candidate build uses rcitcs.com as its only public canonical identity
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/about-us.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt

          grep -Fq 'rel="canonical" href="https://rcitcs.com/about-us"' dist/about-us.html
          grep -Fq 'property="og:url" content="https://rcitcs.com/about-us"' dist/about-us.html
          ! grep -Fq 'rc-it-consulting-services.rcitcservices.workers.dev/about-us' dist/about-us.html

          grep -Fq '<loc>https://rcitcs.com/' dist/sitemap.xml
          ! grep -Fq 'rc-it-consulting-services.rcitcservices.workers.dev' dist/sitemap.xml

          grep -Fq 'Sitemap: https://rcitcs.com/sitemap.xml' dist/robots.txt
          ! grep -Fq 'Sitemap: https://rc-it-consulting-services.rcitcservices.workers.dev' dist/robots.txt

          echo 'Candidate production build uses rcitcs.com for canonical, Open Graph, sitemap and robots identity.'

      - name: Verify apex DNS and direct HTTPS delivery
        shell: bash
        run: |
          set -euo pipefail

          getent ahosts rcitcs.com >/tmp/rcitcs-dns.txt
          test -s /tmp/rcitcs-dns.txt
          cat /tmp/rcitcs-dns.txt

          code=$(curl -sS --max-time 20 -D /tmp/apex.headers -o /tmp/apex.html -w '%{http_code}' https://rcitcs.com/)
          test "$code" = '200'
          grep -qi '^content-type: *text/html' /tmp/apex.headers
          grep -q 'Technology that' /tmp/apex.html
          grep -q 'data-prerendered-path="/"' /tmp/apex.html
          ! grep -q 'Administrator sign in' /tmp/apex.html

          if grep -qi '^location:' /tmp/apex.headers; then
            echo 'rcitcs.com unexpectedly redirects instead of serving the public application directly.' >&2
            cat /tmp/apex.headers >&2
            exit 1
          fi

          echo "rcitcs.com root=${code}"

      - name: Verify pull request has not silently replaced production
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_PRODUCTION_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          curl -sS --max-time 20 https://rcitcs.com/ -o /tmp/apex-sha.html
          grep -Fq "name=\"rc-deployment-sha\" content=\"${EXPECTED_PRODUCTION_SHA}\"" /tmp/apex-sha.html || {
            echo "Production apex is not serving expected base SHA ${EXPECTED_PRODUCTION_SHA}." >&2
            exit 1
          }
          echo "Production remains on PR base SHA ${EXPECTED_PRODUCTION_SHA}; the unmerged Phase-17 branch has not replaced production."

      - name: Wait for exact merged SHA and verify live apex canonical identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 72); do
            code=$(curl -sS --max-time 20 -o /tmp/live-root.html -w '%{http_code}' https://rcitcs.com/ || true)
            if [[ "$code" == '200' ]] && grep -Fq "name=\"rc-deployment-sha\" content=\"${EXPECTED_SHA}\"" /tmp/live-root.html; then
              break
            fi
            if [[ "$attempt" == '72' ]]; then
              echo "rcitcs.com did not expose exact merged SHA ${EXPECTED_SHA} within the verification window." >&2
              exit 1
            fi
            sleep 5
          done

          curl -sS --max-time 20 https://rcitcs.com/about-us -o /tmp/live-about.html
          grep -Fq 'rel="canonical" href="https://rcitcs.com/about-us"' /tmp/live-about.html
          ! grep -Fq 'rc-it-consulting-services.rcitcservices.workers.dev/about-us' /tmp/live-about.html

          curl -sS --max-time 20 https://rcitcs.com/sitemap.xml -o /tmp/live-sitemap.xml
          grep -Fq '<loc>https://rcitcs.com/' /tmp/live-sitemap.xml
          ! grep -Fq 'rc-it-consulting-services.rcitcservices.workers.dev' /tmp/live-sitemap.xml

          curl -sS --max-time 20 https://rcitcs.com/robots.txt -o /tmp/live-robots.txt
          grep -Fq 'Sitemap: https://rcitcs.com/sitemap.xml' /tmp/live-robots.txt

          echo "Exact merged SHA ${EXPECTED_SHA} and live apex canonical identity verified."

      - name: Verify apex public API and admin separation baseline
        shell: bash
        run: |
          set -euo pipefail

          health_code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' https://rcitcs.com/api/health)
          test "$health_code" = '200'
          grep -q '"ok":true' /tmp/health.json

          alias_code=$(curl -sS --max-time 20 -D /tmp/admin-alias.headers -o /dev/null -w '%{http_code}' https://rcitcs.com/admin)
          test "$alias_code" = '308'
          grep -qi '^location: *https://admin\.rcitcs\.com/' /tmp/admin-alias.headers

          mutation_code=$(curl -sS --max-time 20 -o /tmp/admin-mutation.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=phase17-2@example.invalid&password=not-a-real-password' \
            https://rcitcs.com/admin/login)
          test "$mutation_code" = '404'

          echo 'Public API health and inherited public/admin safety boundary verified.'

      - name: Phase 17.2 acceptance
        run: |
          echo 'Phase 17.2 rcitcs.com public production ownership gate: PASS'
          echo 'Candidate source/build identity is apex-canonical; pull requests do not mutate production.'
