name: Phase 14 Contact Inbox Runtime Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge-admin-navigation:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase-14-contact-enquiry-administration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Phase 14 branch
        uses: actions/checkout@v6
        with:
          ref: phase-14-contact-enquiry-administration
          fetch-depth: 0

      - name: Converge Jobs on shared admin navigation
        shell: python
        run: |
          from pathlib import Path

          jobs_path = Path('supabase/functions/admin-auth/jobs.ts')
          jobs = jobs_path.read_text()
          old_import = 'import { esc, prettyTime, shell, type AdminSessionView } from "./ui.ts";'
          new_import = 'import { adminHeader, esc, prettyTime, shell, type AdminSessionView } from "./ui.ts";'
          changed = False
          if old_import in jobs:
              jobs = jobs.replace(old_import, new_import, 1)
              changed = True
          if 'function adminHeader(' in jobs:
              start = jobs.find('function icon(')
              end = jobs.find('function workspaceBar(', start)
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit('Expected legacy Jobs navigation block not found')
              jobs = jobs[:start] + jobs[end:]
              changed = True
          if 'function adminHeader(' in jobs or 'function icon(' in jobs:
              raise SystemExit('Legacy Jobs navigation renderer remains')
          if 'import { adminHeader,' not in jobs or 'adminHeader(basePath, session, "jobs")' not in jobs:
              raise SystemExit('Jobs is not using shared adminHeader')
          if changed:
              jobs_path.write_text(jobs)

          test_path = Path('tests/phase14-contact-inbox.mjs')
          test = test_path.read_text()
          marker = "console.log('Phase 14.4 contact inbox routing, RPC contract, privacy, filtering, keyset pagination, accessibility and read-only boundaries passed.');"
          sentinel = 'All affected administration workspaces must converge on the shared navigation authority.'
          if sentinel not in test:
              if marker not in test:
                  raise SystemExit('Phase 14.4 test marker not found')
              assertions = r'''
// All affected administration workspaces must converge on the shared navigation authority.
const ui = await readFile(path.join(root, 'supabase/functions/admin-auth/ui.ts'), 'utf8');
const jobs = await readFile(path.join(root, 'supabase/functions/admin-auth/jobs.ts'), 'utf8');
const applications = await readFile(path.join(root, 'supabase/functions/admin-auth/applications.ts'), 'utf8');
const security = await readFile(path.join(root, 'supabase/functions/admin-auth/security.ts'), 'utf8');
assert.match(ui, /export function adminHeader\(/);
for (const navLabel of ['Overview', 'Jobs', 'Applications', 'Contacts', 'Security']) {
  assert.match(ui, new RegExp(`<span>${navLabel}<\\/span>`), `Shared desktop navigation is missing ${navLabel}`);
  assert.match(ui, new RegExp(`>${navLabel}<\\/a>`), `Shared mobile navigation is missing ${navLabel}`);
}
for (const [name, source, current] of [
  ['Jobs', jobs, 'jobs'],
  ['Applications', applications, 'applications'],
  ['Contacts', contacts, 'contacts'],
  ['Security', security, 'security']
]) {
  assert.match(source, /import \{ adminHeader,/i, `${name} does not import the shared admin navigation authority`);
  assert.match(source, new RegExp(`adminHeader\\(basePath, session, ["']${current}["']\\)`), `${name} does not select its shared navigation state`);
  assert.doesNotMatch(source, /function adminHeader\(/, `${name} still owns a duplicate admin header renderer`);
}
'''
              test = test.replace(marker, assertions + '\n' + marker, 1)
              test_path.write_text(test)
              changed = True

          Path('/tmp/phase14_nav_changed').write_text('1' if changed else '0')

      - name: Commit convergence if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/phase14_nav_changed)" != "1" ]; then
            echo 'Navigation already converged.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/admin-auth/jobs.ts tests/phase14-contact-inbox.mjs
          git diff --cached --check
          git commit -m "fix(phase14): converge admin navigation authority"
          git push origin HEAD:phase-14-contact-enquiry-administration

  contact-inbox-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed admin health contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 'https://chsizmffzpxcqhaptjeu.supabase.co/functions/v1/admin-auth/health')"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true) throw new Error("admin health is not ok");
            if (body.service !== "rcitcs-admin") throw new Error("unexpected admin service");
            if (body.dashboard !== true || body.jobs !== true || body.applications !== true || body.contacts !== true) throw new Error("admin capability contract incomplete");
            if (body.design !== "phase12-candidate-application-workflow") throw new Error("Phase 12 design contract regressed");
          ' "$body"

      - name: Verify contacts remain behind authentication
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" --write-out '%{http_code}' 'https://admin.rcitcs.com/contacts')"
          test "$status" = "200"
          grep -qi '^x-robots-tag: .*noindex' "$headers"
          grep -qi '^cache-control: .*no-store' "$headers"
          grep -q 'Administrator sign in' "$body"
          if grep -q 'id="contacts-title"' "$body"; then
            echo 'Unauthenticated contacts inbox was rendered.' >&2
            exit 1
          fi
          if grep -q 'Contact inbox' "$body"; then
            echo 'Unauthenticated contact data surface was rendered.' >&2
            exit 1
          fi
