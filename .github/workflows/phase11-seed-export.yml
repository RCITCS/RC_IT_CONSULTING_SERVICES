name: Phase 11 legacy job seed export

on:
  push:
    branches:
      - phase-11-job-management-cms
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Export approved Careers catalog
        run: node scripts/export-phase11-legacy-job-seed.mjs phase11-legacy-job-seed.sql phase11-legacy-job-seed-manifest.json
      - name: Verify generated seed has no secret-like tokens
        run: |
          ! grep -E 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|ADMIN_BOOTSTRAP_PASSWORD_VERIFIER' phase11-legacy-job-seed.sql
          node -e "const m=require('./phase11-legacy-job-seed-manifest.json'); if(!m.totalJobs) process.exit(1); console.log(m)"
      - name: Upload generated seed
        uses: actions/upload-artifact@v4
        with:
          name: phase11-legacy-job-seed
          path: |
            phase11-legacy-job-seed.sql
            phase11-legacy-job-seed-manifest.json
          if-no-files-found: error
          retention-days: 3
