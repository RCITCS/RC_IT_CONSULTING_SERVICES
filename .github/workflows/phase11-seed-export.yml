name: Phase 11 legacy job seed export

on:
  push:
    branches:
      - phase-11-job-management-cms
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: phase-11-job-management-cms
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Export approved Careers catalog
        run: node scripts/export-phase11-legacy-job-seed.mjs supabase/migrations/20260910164000_phase_11_legacy_job_catalog_seed.sql phase11-legacy-job-seed-manifest.json
      - name: Verify generated seed has no secret-like tokens
        run: |
          ! grep -E 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|ADMIN_BOOTSTRAP_PASSWORD_VERIFIER' supabase/migrations/20260910164000_phase_11_legacy_job_catalog_seed.sql
          node -e "const m=require('./phase11-legacy-job-seed-manifest.json'); if(m.totalJobs !== 46 || m.statuses.published !== 46 || m.categories !== 18) process.exit(1); console.log(m)"
      - name: Commit deterministic migration when changed
        run: |
          git add supabase/migrations/20260910164000_phase_11_legacy_job_catalog_seed.sql
          if git diff --cached --quiet; then
            echo "Generated migration is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Phase 11 approved Careers catalog seed"
          git push origin HEAD:phase-11-job-management-cms
      - name: Upload generated seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase11-legacy-job-seed
          path: |
            supabase/migrations/20260910164000_phase_11_legacy_job_catalog_seed.sql
            phase11-legacy-job-seed-manifest.json
          if-no-files-found: error
          retention-days: 3
