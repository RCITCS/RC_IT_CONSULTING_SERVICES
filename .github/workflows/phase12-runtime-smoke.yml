name: Phase 12 Runtime Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: Verify deployed Phase 12 runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify candidate and admin Edge boundaries
        shell: bash
        run: |
          set -euo pipefail
          ADMIN='https://chsizmffzpxcqhaptjeu.supabase.co/functions/v1/admin-auth'
          CANDIDATE='https://chsizmffzpxcqhaptjeu.supabase.co/functions/v1/candidate-applications'

          candidate_code=$(curl -sS -o /tmp/candidate-health.json -w '%{http_code}' "${CANDIDATE}/health")
          test "$candidate_code" = '200'
          grep -q '"ok":true' /tmp/candidate-health.json
          grep -q '"contract":"phase12-candidate-intake-v1"' /tmp/candidate-health.json

          admin_code=$(curl -sS -D /tmp/admin-health.headers -o /tmp/admin-health.json -w '%{http_code}' "${ADMIN}/health")
          test "$admin_code" = '200'
          grep -q '"ok":true' /tmp/admin-health.json
          grep -q '"jobs":true' /tmp/admin-health.json
          grep -q '"applications":true' /tmp/admin-health.json
          grep -q '"design":"phase12-candidate-application-workflow"' /tmp/admin-health.json
          tr -d '\r' < /tmp/admin-health.headers | grep -qi '^cache-control:.*no-store'

          applications_code=$(curl -sS -D /tmp/applications.headers -o /tmp/applications.html -w '%{http_code}' "${ADMIN}/applications")
          test "$applications_code" = '200'
          grep -q 'Administrator sign in' /tmp/applications.html
          tr -d '\r' < /tmp/applications.headers | grep -qi '^cache-control:.*no-store'
          tr -d '\r' < /tmp/applications.headers | grep -qi '^x-robots-tag:.*noindex'

          session_code=$(curl -sS -D /tmp/session.headers -o /tmp/session.json -w '%{http_code}' "${ADMIN}/session")
          test "$session_code" = '401'
          grep -q '"authenticated":false' /tmp/session.json
          tr -d '\r' < /tmp/session.headers | grep -qi '^cache-control:.*no-store'

          echo 'Deployed Phase 12 candidate and admin runtimes verified.'
