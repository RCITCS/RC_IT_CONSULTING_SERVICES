name: RC Admin Portal Domain Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-admin-domain-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-admin-domains:
    name: Verify dedicated admin portal domains
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify production admin portal
        shell: bash
        run: |
          set -euo pipefail
          ADMIN='https://admin.rcitcs.com'

          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 20 -D /tmp/admin-root.headers -o /tmp/admin-root.html -w '%{http_code}' "${ADMIN}/" || true)
            environment=$(awk -F': *' 'tolower($1)=="x-rc-admin-environment" {gsub(/\r/,"",$2); print tolower($2)}' /tmp/admin-root.headers | tail -n1)
            build=$(awk -F': *' 'tolower($1)=="x-rc-admin-build-surface" {gsub(/\r/,"",$2); print $2}' /tmp/admin-root.headers | tail -n1)
            media=$(awk -F': *' 'tolower($1)=="x-rc-admin-html-media-fix" {gsub(/\r/,"",$2); print $2}' /tmp/admin-root.headers | tail -n1)

            if [[ "$code" == '200' && "$environment" == 'production' \
              && "$build" == 'phase16-security-closure-v1' \
              && "$media" == 'phase16-html-content-type-v1' ]] \
              && grep -q '<!doctype html>' /tmp/admin-root.html \
              && grep -q 'Administrator sign in' /tmp/admin-root.html \
              && grep -q 'Private administration for controlled operational work.' /tmp/admin-root.html \
              && grep -q 'action="/login"' /tmp/admin-root.html \
              && ! grep -q 'action="/admin/login"' /tmp/admin-root.html \
              && ! grep -q '/functions/v1/admin-auth' /tmp/admin-root.html \
              && ! grep -q 'Technology that moves business forward' /tmp/admin-root.html; then
              break
            fi

            if [[ "$attempt" == '60' ]]; then
              echo 'Production admin portal did not converge.' >&2
              exit 1
            fi
            sleep 5
          done

          grep -qi '^content-type: *text/html' /tmp/admin-root.headers
          grep -qi '^cache-control:.*no-store' /tmp/admin-root.headers
          grep -qi '^x-robots-tag:.*noindex' /tmp/admin-root.headers
          grep -qi '^x-frame-options: *DENY' /tmp/admin-root.headers
          grep -qi '^content-security-policy:' /tmp/admin-root.headers
          grep -qi '^strict-transport-security:' /tmp/admin-root.headers
          grep -qi '^x-rc-admin-edge-release: *phase12-job-authoring-v1' /tmp/admin-root.headers

      - name: Verify staging isolation contract
        shell: bash
        run: |
          set -euo pipefail
          STAGING='https://admin-staging.rcitcs.com'

          getent ahosts admin-staging.rcitcs.com >/dev/null
          code=$(curl -sS --max-time 20 -D /tmp/staging.headers -o /tmp/staging.txt -w '%{http_code}' "${STAGING}/")
          test "$code" = '503'
          grep -Fxq 'Staging administration is intentionally unavailable.' /tmp/staging.txt
          grep -qi '^x-rc-admin-environment: *staging' /tmp/staging.headers
          grep -qi '^x-rc-admin-staging-state: *intentionally-unavailable' /tmp/staging.headers
          grep -qi '^x-rc-admin-build-surface: *phase16-security-closure-v1' /tmp/staging.headers
          grep -qi '^cache-control:.*no-store' /tmp/staging.headers
          grep -qi '^x-robots-tag:.*noindex' /tmp/staging.headers
          grep -qi '^content-security-policy:' /tmp/staging.headers
          grep -qi '^strict-transport-security:' /tmp/staging.headers

      - name: Verify production admin routes stay on the admin host
        shell: bash
        run: |
          set -euo pipefail
          ADMIN='https://admin.rcitcs.com'

          for route in /applications /jobs; do
            body="/tmp/admin$(echo "$route" | tr '/' '-').html"
            headers="/tmp/admin$(echo "$route" | tr '/' '-').headers"
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "${ADMIN}${route}")
            test "$code" = '200'
            grep -q 'Administrator sign in' "$body"
            ! grep -q 'Technology that moves business forward' "$body"
            ! grep -q '/functions/v1/admin-auth' "$body"
            grep -qi '^content-type: *text/html' "$headers"
            grep -qi '^cache-control:.*no-store' "$headers"
            grep -qi '^x-robots-tag:.*noindex' "$headers"
            grep -qi '^x-rc-admin-build-surface: *phase16-security-closure-v1' "$headers"
            grep -qi '^x-rc-admin-html-media-fix: *phase16-html-content-type-v1' "$headers"
            grep -qi '^x-rc-admin-environment: *production' "$headers"
          done

          session_code=$(curl -sS -D /tmp/admin-session.headers -o /tmp/admin-session.json -w '%{http_code}' "${ADMIN}/session")
          test "$session_code" = '401'
          grep -q '"authenticated":false' /tmp/admin-session.json
          grep -qi '^cache-control:.*no-store' /tmp/admin-session.headers
          grep -qi '^x-rc-admin-environment: *production' /tmp/admin-session.headers

          rejected_code=$(curl -sS -o /tmp/admin-rejected.txt -w '%{http_code}' -X POST \
            -H 'Origin: https://example.invalid' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=x&password=x' \
            "${ADMIN}/login")
          test "$rejected_code" = '403'
          grep -q 'Request rejected' /tmp/admin-rejected.txt

      - name: Verify public admin separation
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC='https://rcitcs.com'

          alias_code=$(curl -sS -D /tmp/public-admin.headers -o /dev/null -w '%{http_code}' "${PUBLIC}/admin")
          test "$alias_code" = '308'
          grep -qi '^location: *https://admin\.rcitcs\.com/' /tmp/public-admin.headers
          grep -qi '^cache-control:.*no-store' /tmp/public-admin.headers

          post_code=$(curl -sS -o /tmp/public-admin-post.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=x&password=x' \
            "${PUBLIC}/admin/login")
          test "$post_code" = '404'

          echo 'Production admin, intentional staging isolation, and public admin separation verified.'
