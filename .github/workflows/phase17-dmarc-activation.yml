name: Phase 17 DMARC Activation

on:
  push:
    branches:
      - phase17-domain-ownership-convergence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-dmarc-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Publish missing Phase 17 DMARC policy safely
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZONE_ID: cf815244b9dbd51a490747f597867c68
      EXPECTED_ACCOUNT_ID: 3fdd024f6fbc25c03ed4481352576540
      EXPECTED_ZONE: rcitcs.com
      DMARC_NAME: _dmarc.rcitcs.com
      DMARC_VALUE: 'v=DMARC1; p=none; rua=mailto:dmarc@rcitcs.com; adkim=s; aspf=s; pct=100'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Resolve authorized Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
          if [[ -z "$TOKEN" ]]; then
            echo '::error::No CLOUDFLARE_API_TOKEN or CF_API_TOKEN repository secret is configured. No DNS mutation was attempted.'
            exit 1
          fi
          echo "CF_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Verify token is scoped to the authoritative RC IT zone
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}" \
            -o /tmp/zone.json

          python - <<'PY'
          import json, os, sys
          data = json.load(open('/tmp/zone.json', encoding='utf-8'))
          result = data.get('result') or {}
          account = result.get('account') or {}
          if not data.get('success'):
              print('Cloudflare token could not read the expected zone.', file=sys.stderr)
              sys.exit(1)
          if result.get('name') != os.environ['EXPECTED_ZONE']:
              print('Cloudflare token resolved the wrong zone name.', file=sys.stderr)
              sys.exit(1)
          if account.get('id') != os.environ['EXPECTED_ACCOUNT_ID']:
              print('Cloudflare token resolved the wrong account.', file=sys.stderr)
              sys.exit(1)
          print('Authoritative RC IT Cloudflare account/zone identity verified.')
          PY

      - name: Create DMARC only when absent and never overwrite an existing policy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=TXT&name=${DMARC_NAME}" \
            -o /tmp/dmarc-before.json

          action=$(python - <<'PY'
          import json, os, sys
          data = json.load(open('/tmp/dmarc-before.json', encoding='utf-8'))
          if not data.get('success'):
              print('Unable to query current DMARC state.', file=sys.stderr)
              sys.exit(1)
          records = data.get('result') or []
          expected = os.environ['DMARC_VALUE']
          if len(records) == 0:
              print('create')
          elif len(records) == 1 and records[0].get('content') == expected:
              print('noop')
          elif len(records) == 1:
              print('Existing DMARC differs from the Phase-17 policy; refusing to overwrite it.', file=sys.stderr)
              sys.exit(2)
          else:
              print('Multiple DMARC records exist; refusing mutation.', file=sys.stderr)
              sys.exit(3)
          PY
          )

          if [[ "$action" == 'noop' ]]; then
            echo 'Exact DMARC policy already exists; no mutation required.'
            exit 0
          fi

          python - <<'PY' >/tmp/dmarc-payload.json
          import json, os
          print(json.dumps({
              'type': 'TXT',
              'name': os.environ['DMARC_NAME'],
              'content': os.environ['DMARC_VALUE'],
              'ttl': 1,
              'comment': 'Phase 17 initial monitoring DMARC policy'
          }))
          PY

          curl -fsS -X POST \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/dmarc-payload.json \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -o /tmp/dmarc-create.json

          python - <<'PY'
          import json, os, sys
          data = json.load(open('/tmp/dmarc-create.json', encoding='utf-8'))
          result = data.get('result') or {}
          if not data.get('success'):
              print('Cloudflare rejected DMARC creation.', file=sys.stderr)
              sys.exit(1)
          if result.get('type') != 'TXT' or result.get('name') != os.environ['DMARC_NAME'] or result.get('content') != os.environ['DMARC_VALUE']:
              print('Cloudflare response did not match the requested DMARC record.', file=sys.stderr)
              sys.exit(1)
          print('Exact Phase-17 DMARC record created in the authoritative zone.')
          PY

      - name: Verify public DNS convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            raw=$(dig +short TXT "${DMARC_NAME}" | tr -d '\r' || true)
            count=$(printf '%s\n' "$raw" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
            if [[ "$count" == '1' ]]; then
              value=$(printf '%s' "$raw" | tr -d '"')
              if [[ "$value" == "$DMARC_VALUE" ]]; then
                echo 'Public DNS now exposes the exact Phase-17 DMARC policy.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'DMARC was written but did not converge publicly within the verification window.' >&2
          exit 1
