name: Phase 17 Domain Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-domain-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Verify Phase 17.1 pre-change domain baseline
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify source-controlled ownership baseline
        run: node tests/phase17-domain-baseline.mjs

      - name: Inventory public DNS resolution without changing control plane
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            rcitcs.com
            www.rcitcs.com
            admin.rcitcs.com
            admin-staging.rcitcs.com
          )

          for host in "${hosts[@]}"; do
            echo "===== ${host} ====="
            if getent ahosts "$host"; then
              echo "RESOLUTION=${host}:present"
            else
              echo "RESOLUTION=${host}:absent"
            fi
          done

      - name: Record public DNS record surface
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            rcitcs.com
            www.rcitcs.com
            admin.rcitcs.com
            admin-staging.rcitcs.com
          )
          record_types=(A AAAA CNAME)

          echo '===== ZONE NS ====='
          dig +noall +answer rcitcs.com NS || true
          echo '===== ZONE SOA ====='
          dig +noall +answer rcitcs.com SOA || true
          echo '===== ZONE MX ====='
          dig +noall +answer rcitcs.com MX || true
          echo '===== ZONE TXT ====='
          dig +noall +answer rcitcs.com TXT || true
          echo '===== ZONE CAA ====='
          dig +noall +answer rcitcs.com CAA || true

          for host in "${hosts[@]}"; do
            for type in "${record_types[@]}"; do
              echo "===== ${host} ${type} ====="
              answer=$(dig +noall +answer "$host" "$type" || true)
              if [ -n "$answer" ]; then
                printf '%s\n' "$answer"
              else
                echo 'NO_PUBLIC_ANSWER'
              fi
            done
          done

          echo 'Public DNS snapshot recorded. Historical Phase 17.1 control-plane evidence remains in docs/PHASE_17_DOMAIN_BASELINE.md.'

      - name: Record current host behavior without enforcing the historical topology
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            'https://rcitcs.com/'
            'https://www.rcitcs.com/'
            'https://admin.rcitcs.com/'
            'https://admin-staging.rcitcs.com/'
          )

          for url in "${hosts[@]}"; do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)
            location=$(awk -F': *' 'tolower($1)=="location" {gsub(/\r/,"",$2); print $2}' "$headers" | tail -n1)
            environment=$(awk -F': *' 'tolower($1)=="x-rc-admin-environment" {gsub(/\r/,"",$2); print $2}' "$headers" | tail -n1)
            staging_state=$(awk -F': *' 'tolower($1)=="x-rc-admin-staging-state" {gsub(/\r/,"",$2); print $2}' "$headers" | tail -n1)
            echo "${url} status=${code:-unavailable} location=${location:-none} admin_environment=${environment:-none} staging_state=${staging_state:-none}"
          done

          echo 'Current live behavior recorded for audit only. Historical Phase 17.1 pre-change behavior is evidence, not a perpetual production invariant.'
