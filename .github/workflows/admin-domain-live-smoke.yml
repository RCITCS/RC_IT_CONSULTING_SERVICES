name: Admin Domain Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-it-services-admin-domain-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-admin-domains:
    name: Verify dedicated admin hostnames
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify production admin domain
        shell: bash
        run: |
          set -euo pipefail
          ADMIN='https://admin.rcitcs.com'

          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 20 -D /tmp/admin.headers -o /tmp/admin.html -w '%{http_code}' "${ADMIN}/" || true)
            environment=$(awk -F': *' 'tolower($1)=="x-rc-admin-environment" {gsub(/\r/,"",$2); print tolower($2)}' /tmp/admin.headers | tail -n1)
            release=$(awk -F': *' 'tolower($1)=="x-rc-admin-edge-release" {gsub(/\r/,"",$2); print $2}' /tmp/admin.headers | tail -n1)
            build=$(awk -F': *' 'tolower($1)=="x-rc-admin-build-surface" {gsub(/\r/,"",$2); print $2}' /tmp/admin.headers | tail -n1)
            echo "production attempt=${attempt} status=${code} environment=${environment:-none} release=${release:-none} build=${build:-none}"

            if [[ "$code" == '200' && "$environment" == 'production' \
              && "$release" == 'phase12-job-authoring-v1' \
              && "$build" == 'phase16-security-closure-v1' ]] \
              && grep -q 'Administrator sign in' /tmp/admin.html \
              && grep -q 'Private administration for controlled operational work.' /tmp/admin.html \
              && ! grep -q 'Technology that' /tmp/admin.html \
              && ! grep -q '/functions/v1/admin-auth' /tmp/admin.html; then
              break
            fi

            if [[ "$attempt" == '60' ]]; then
              echo 'Production admin domain did not converge to the dedicated production Worker.' >&2
              exit 1
            fi
            sleep 5
          done

          grep -qi '^content-type: *text/html' /tmp/admin.headers
          grep -qi '^cache-control:.*no-store' /tmp/admin.headers
          grep -qi '^x-robots-tag:.*noindex' /tmp/admin.headers
          grep -qi '^x-frame-options: *DENY' /tmp/admin.headers
          grep -qi '^content-security-policy:' /tmp/admin.headers
          grep -qi '^strict-transport-security:' /tmp/admin.headers
          grep -qi '^x-rc-admin-html-media-fix: *phase16-html-content-type-v1' /tmp/admin.headers

          session_code=$(curl -sS -D /tmp/admin-session.headers -o /tmp/admin-session.json -w '%{http_code}' "${ADMIN}/session")
          test "$session_code" = '401'
          grep -q '"authenticated":false' /tmp/admin-session.json
          grep -qi '^cache-control:.*no-store' /tmp/admin-session.headers
          grep -qi '^x-rc-admin-environment: *production' /tmp/admin-session.headers

          interaction_code=$(curl -sS -D /tmp/admin-interactions.headers -o /tmp/admin-interactions.js -w '%{http_code}' "${ADMIN}/__rc-admin/interactions.js")
          test "$interaction_code" = '200'
          grep -Fq 'history.pushState' /tmp/admin-interactions.js
          grep -Fq 'showModal()' /tmp/admin-interactions.js
          grep -Fq 'x-rc-admin-soft-submit' /tmp/admin-interactions.js
          ! grep -Fq 'location.reload(' /tmp/admin-interactions.js
          grep -qi '^cache-control:.*no-store' /tmp/admin-interactions.headers
          grep -qi '^cross-origin-resource-policy: *same-origin' /tmp/admin-interactions.headers

          mobile_code=$(curl -sS -o /tmp/admin-mobile.html -w '%{http_code}' \
            -X POST -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=not-the-admin%40example.invalid' \
            "${ADMIN}/forgot-password")
          test "$mobile_code" = '200'
          ! grep -q 'Request rejected' /tmp/admin-mobile.html

          rejected_code=$(curl -sS -o /tmp/admin-rejected.txt -w '%{http_code}' \
            -X POST -H 'Origin: https://example.invalid' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'email=not-the-admin%40example.invalid' \
            "${ADMIN}/forgot-password")
          test "$rejected_code" = '403'
          grep -q 'Request rejected' /tmp/admin-rejected.txt

      - name: Verify staging is intentionally unavailable
        shell: bash
        run: |
          set -euo pipefail
          STAGING='https://admin-staging.rcitcs.com'

          getent ahosts admin-staging.rcitcs.com >/dev/null
          code=$(curl -sS --max-time 20 -D /tmp/staging.headers -o /tmp/staging.txt -w '%{http_code}' "${STAGING}/")
          test "$code" = '503'
          grep -Fxq 'Staging administration is intentionally unavailable.' /tmp/staging.txt
          grep -qi '^x-rc-admin-environment: *staging' /tmp/staging.headers
          grep -qi '^x-rc-admin-staging-state: *intentionally-unavailable' /tmp/staging.headers
          grep -qi '^x-rc-admin-build-surface: *phase16-security-closure-v1' /tmp/staging.headers
          grep -qi '^cache-control:.*no-store' /tmp/staging.headers
          grep -qi '^x-robots-tag:.*noindex' /tmp/staging.headers
          grep -qi '^x-frame-options: *DENY' /tmp/staging.headers
          grep -qi '^strict-transport-security:' /tmp/staging.headers
          ! grep -q 'Administrator sign in' /tmp/staging.txt
          ! grep -q 'Technology that' /tmp/staging.txt

      - name: Verify public apex separation
        shell: bash
        run: |
          set -euo pipefail
          public_code=$(curl -L -sS -D /tmp/public.headers -o /tmp/public.html -w '%{http_code}' 'https://rcitcs.com/')
          test "$public_code" = '200'
          grep -q 'Technology that' /tmp/public.html
          ! grep -q 'Administrator sign in' /tmp/public.html
          grep -qi '^strict-transport-security:' /tmp/public.headers

          echo 'Production admin, intentional staging isolation, and public-host separation verified.'
