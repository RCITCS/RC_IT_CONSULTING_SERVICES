name: Admin Domain Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-it-services-admin-domain-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-admin-domains:
    name: Verify dedicated admin hostnames
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Diagnose DNS and verify production admin domain
        shell: bash
        run: |
          set -uo pipefail
          failures=0

          diagnose_dns() {
            local host="$1"
            echo "--- DNS ${host} ---"
            if command -v dig >/dev/null 2>&1; then
              echo 'CNAME:'
              dig +short CNAME "$host" || true
              echo 'A:'
              dig +short A "$host" || true
              echo 'AAAA:'
              dig +short AAAA "$host" || true
            else
              getent ahosts "$host" || true
            fi
          }

          verify_admin() {
            local admin="$1"
            local label="$2"
            local expected_release="${3:-}"
            local host="${admin#https://}"
            local body="/tmp/${label}-admin.html"
            local headers="/tmp/${label}-admin.headers"
            local passed=0

            diagnose_dns "$host"

            for attempt in $(seq 1 40); do
              code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$admin/" || true)
              title=$(grep -o '<title>[^<]*' "$body" 2>/dev/null | head -n1 || true)
              release=$(tr -d '\r' < "$headers" | awk -F': *' 'tolower($1)=="x-rc-admin-edge-release" {print $2}' | tail -n1)
              echo "${label} attempt=${attempt} status=${code} release=${release:-none} ${title}"

              release_ok=1
              if [[ -n "$expected_release" && "$release" != "$expected_release" ]]; then
                release_ok=0
              fi

              if [[ "$code" == '200' ]] \
                && [[ "$release_ok" == '1' ]] \
                && grep -q 'Administrator sign in' "$body" \
                && grep -q 'Private administration for controlled operational work.' "$body" \
                && ! grep -q 'Technology that' "$body" \
                && ! grep -q 'data-prerendered-path="/"' "$body"; then
                passed=1
                break
              fi
              sleep 5
            done

            if [[ "$passed" != '1' ]]; then
              echo "${label} admin domain is NOT serving the expected private portal release." >&2
              sed -n '1,24p' "$body" >&2 || true
              failures=$((failures + 1))
              return
            fi

            tr -d '\r' < "$headers" | grep -qi '^cache-control:.*no-store' || failures=$((failures + 1))
            tr -d '\r' < "$headers" | grep -qi '^x-robots-tag:.*noindex' || failures=$((failures + 1))
            tr -d '\r' < "$headers" | grep -qi '^x-frame-options: *DENY' || failures=$((failures + 1))

            session_code=$(curl -sS -D "/tmp/${label}-session.headers" -o "/tmp/${label}-session.json" -w '%{http_code}' "$admin/session" || true)
            if [[ "$session_code" != '401' ]] || ! grep -q '"authenticated":false' "/tmp/${label}-session.json"; then
              echo "${label} session boundary failed; status=${session_code}." >&2
              failures=$((failures + 1))
            fi

            if [[ "$label" == 'production' ]]; then
              if ! grep -Fq '.workspace[aria-labelledby="jobs-title"] .activity-table' "$body" \
                || ! grep -Fq '.workspace[aria-labelledby="applications-title"] .activity-table' "$body" \
                || ! grep -Fq 'content:"Candidate"' "$body" \
                || ! grep -Fq 'content:"Actions"' "$body"; then
                echo 'Production admin HTML is missing the Phase 12 Jobs/Applications mobile register stylesheet.' >&2
                failures=$((failures + 1))
              fi

              mobile_code=$(curl -sS -o /tmp/admin-mobile-compatible.html -w '%{http_code}' \
                -X POST \
                -H 'content-type: application/x-www-form-urlencoded' \
                --data 'email=not-the-admin%40example.invalid' \
                "$admin/forgot-password" || true)
              if [[ "$mobile_code" != '200' ]] || grep -q 'Request rejected' /tmp/admin-mobile-compatible.html; then
                echo "Header-sparse iPhone/iPad form compatibility failed; status=${mobile_code}." >&2
                failures=$((failures + 1))
              fi

              rejected_code=$(curl -sS -o /tmp/admin-cross-origin-rejected.txt -w '%{http_code}' \
                -X POST \
                -H 'Origin: https://example.invalid' \
                -H 'content-type: application/x-www-form-urlencoded' \
                --data 'email=not-the-admin%40example.invalid' \
                "$admin/forgot-password" || true)
              if [[ "$rejected_code" != '403' ]] || ! grep -q 'Request rejected' /tmp/admin-cross-origin-rejected.txt; then
                echo "Explicit cross-origin POST protection failed; status=${rejected_code}." >&2
                failures=$((failures + 1))
              fi
            fi
          }

          verify_admin 'https://admin.rcitcs.com' 'production' 'phase12-ios-post-fallback-v1'

          echo '--- Staging admin DNS diagnostic ---'
          diagnose_dns 'admin-staging.rcitcs.com'
          if getent ahosts admin-staging.rcitcs.com >/dev/null 2>&1; then
            verify_admin 'https://admin-staging.rcitcs.com' 'staging'
          else
            echo 'Staging admin hostname is not provisioned; it is outside the production Phase 12 acceptance gate.'
          fi

          echo '--- Public apex DNS diagnostic ---'
          diagnose_dns 'rcitcs.com'
          if getent ahosts rcitcs.com >/dev/null 2>&1; then
            public_code=$(curl -L -sS -o /tmp/public.html -w '%{http_code}' 'https://rcitcs.com/' || true)
            echo "public status=${public_code}"
            if [[ "$public_code" != '200' ]] || ! grep -q 'Technology that' /tmp/public.html || grep -q 'Administrator sign in' /tmp/public.html; then
              echo 'Provisioned public corporate-site separation failed.' >&2
              failures=$((failures + 1))
            fi
          else
            echo 'Public apex is not provisioned; it is not used as the Phase 12 production application origin.'
          fi

          if [[ "$failures" != '0' ]]; then
            echo "Production admin-domain verification failed with ${failures} finding(s)." >&2
            exit 1
          fi

          echo 'Production dedicated-admin hostname, exact mobile edge release, responsive register stylesheet and cross-origin boundary verified.'
