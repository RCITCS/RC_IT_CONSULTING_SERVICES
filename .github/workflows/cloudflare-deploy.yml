name: RC IT Services CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-it-services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Architecture, test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source architecture
        run: npm run check:architecture

      - name: Smoke tests
        run: npm run test:smoke

      - name: Backend regression tests
        run: npm run test:backend

      - name: Persistence regression tests
        run: npm run test:persistence

      - name: Admin authentication regression tests
        run: npm run test:admin-auth

      - name: Phase 10 dashboard regression tests
        run: npm run test:admin-dashboard

      - name: Phase 10 visual admin delivery regression tests
        run: npm run test:admin-visual-proxy

      - name: Route rendering regression tests
        run: npm run test:render

      - name: Design system regression tests
        run: npm run test:design-system

      - name: Performance routing regression tests
        run: npm run test:performance-routing

      - name: SEO regression tests
        run: npm run test:seo

      - name: SEO preview regression tests
        run: npm run test:seo-preview

      - name: Build optimized prerendered production assets
        run: npm run build

      - name: Enforce production performance budgets
        run: npm run test:performance

      - name: Verify prerendered SEO production output
        run: npm run test:seo-build

      - name: Verify production bundle and Cloudflare configuration
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/_redirects
          test -d dist/assets
          test -f wrangler.jsonc
          test -f wrangler.admin-production.jsonc
          test -f wrangler.admin-staging.jsonc
          test -f worker/index.js
          test -f src/frontend/app/app.js
          test -f src/frontend/styles/app.css
          test -f src/backend/runtime/worker.js
          grep -q 'site-root' dist/index.html
          grep -q 'data-route-styles' dist/index.html
          grep -q 'data-prerendered-path' dist/index.html
          grep -q '404-page' wrangler.jsonc
          grep -q 'drop-trailing-slash' wrangler.jsonc
          grep -q 'rc-it-consulting-services' wrangler.jsonc
          grep -q '"/admin"' wrangler.jsonc
          grep -q '"/admin/\*"' wrangler.jsonc
          grep -q '"crons"' wrangler.jsonc
          grep -q '\*/15 \* \* \* \*' wrangler.jsonc
          grep -q '"workers_dev": false' wrangler.jsonc
          grep -q '"preview_urls": false' wrangler.jsonc
          grep -q '"workers_dev": false' wrangler.admin-production.jsonc
          grep -q '"preview_urls": false' wrangler.admin-production.jsonc
          grep -q '"workers_dev": false' wrangler.admin-staging.jsonc
          grep -q '"preview_urls": false' wrangler.admin-staging.jsonc
          grep -q 'handleAdminRequest' src/backend/runtime/worker.js
          grep -q 'serveApplication' src/backend/runtime/worker.js
          grep -q 'scheduled' worker/index.js
          grep -q 'cleanupExpired' worker/index.js
          grep -q 'getPrerenderRoutes' scripts/build.mjs

  production-route-smoke:
    name: Verify live production routes
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for canonical public production deployment and verify deep routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rcitcs.com'
          routes=(
            '/'
            '/careers'
            '/contact'
            '/services/it/cyber-security'
            '/services/it/consultancy-services/agile'
            '/careers/jobs/senior-data-engineer'
            '/careers/jobs/senior-data-engineer/apply'
            '/privacy'
          )

          for attempt in $(seq 1 72); do
            all_ok=1
            for route in "${routes[@]}"; do
              code=$(curl -sS -o /tmp/rc-page.html -w '%{http_code}' "${BASE}${route}" || true)
              if [[ "$code" != '200' ]] || ! grep -q 'id="main-content"' /tmp/rc-page.html || ! grep -q 'data-prerendered-path=' /tmp/rc-page.html; then
                all_ok=0
                break
              fi
            done

            health_code=$(curl -sS -o /tmp/rc-health.json -w '%{http_code}' "${BASE}/api/health" || true)
            if [[ "$health_code" != '200' ]] || ! grep -q '"ok":true' /tmp/rc-health.json; then
              all_ok=0
            fi

            root_code=$(curl -sS -o /tmp/rc-deployment.html -w '%{http_code}' "${BASE}/" || true)
            if [[ "$root_code" != '200' ]] || ! grep -q 'data-prerendered-path="/"' /tmp/rc-deployment.html || ! grep -q 'global-overrides-' /tmp/rc-deployment.html || ! grep -q 'application/ld+json' /tmp/rc-deployment.html; then
              all_ok=0
            fi

            if [[ "$all_ok" == '1' ]]; then
              echo "Canonical public deployment verified on attempt ${attempt}."
              break
            fi

            if [[ "$attempt" == '72' ]]; then
              echo 'Canonical public deployment did not become healthy within the verification window.' >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify public Careers application SEO and cache boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rcitcs.com'

          curl -sS "${BASE}/about-us" -o /tmp/about.html
          grep -q "rel=\"canonical\" href=\"${BASE}/about-us\"" /tmp/about.html
          grep -q 'property="og:title"' /tmp/about.html
          grep -q "property=\"og:url\" content=\"${BASE}/about-us\"" /tmp/about.html
          grep -q 'application/ld+json' /tmp/about.html

          curl -sS "${BASE}/services/it/cyber-security" -o /tmp/service.html
          grep -q '"@type":"Service"' /tmp/service.html
          grep -q 'BreadcrumbList' /tmp/service.html

          curl -sS "${BASE}/careers/jobs/senior-data-engineer" -o /tmp/job.html
          grep -q "rel=\"canonical\" href=\"${BASE}/careers/jobs/senior-data-engineer\"" /tmp/job.html
          grep -q 'name="robots" content="index,follow"' /tmp/job.html
          grep -q 'Apply for this role' /tmp/job.html
          grep -q 'href="/careers/jobs/senior-data-engineer/apply"' /tmp/job.html
          grep -q 'data-runtime-job-posting' /tmp/job.html
          grep -q '"@type":"JobPosting"' /tmp/job.html
          grep -q '"directApply":true' /tmp/job.html

          curl -sS "${BASE}/careers/jobs/senior-data-engineer/apply" -o /tmp/apply.html
          grep -q 'data-career-application' /tmp/apply.html
          grep -q 'name="resume" type="file"' /tmp/apply.html
          grep -q 'name="robots" content="noindex,nofollow"' /tmp/apply.html
          ! grep -q 'SUPABASE_SECRET_KEY' /tmp/apply.html
          ! grep -q 'sb_secret_' /tmp/apply.html

          rejected_code=$(curl -sS -o /tmp/application-rejected.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            --data '{"action":"start","jobSlug":"senior-data-engineer"}' \
            "${BASE}/api/career-application")
          test "$rejected_code" = '403'
          grep -q 'REQUEST_REJECTED' /tmp/application-rejected.json

          curl -sS "${BASE}/sitemap.xml" -o /tmp/sitemap.xml
          grep -q '<urlset' /tmp/sitemap.xml
          grep -q "${BASE}/services/it/cyber-security" /tmp/sitemap.xml
          ! grep -q "${BASE}/login" /tmp/sitemap.xml
          ! grep -q '/apply</loc>' /tmp/sitemap.xml

          curl -sS "${BASE}/robots.txt" -o /tmp/robots.txt
          grep -q 'Disallow: /api/' /tmp/robots.txt
          grep -q 'Disallow: /admin/' /tmp/robots.txt
          grep -q "Sitemap: ${BASE}/sitemap.xml" /tmp/robots.txt

          unknown_code=$(curl -sS -o /tmp/not-found.html -w '%{http_code}' "${BASE}/definitely-not-a-real-rc-route")
          test "$unknown_code" = '404'
          grep -q 'noindex,nofollow' /tmp/not-found.html

          curl -sS "${BASE}/" -o /tmp/rc-index.html
          app_asset=$(grep -oEm1 '/assets/app-[A-Za-z0-9]+\.js' /tmp/rc-index.html)
          test -n "$app_asset"
          curl -sSI "${BASE}${app_asset}" -o /tmp/app-asset.headers
          grep -qi 'cache-control:.*max-age=31536000.*immutable' /tmp/app-asset.headers

      - name: Verify canonical public and admin domain separation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rcitcs.com'
          ADMIN='https://admin.rcitcs.com'

          public_admin=$(curl -sS -o /dev/null -D /tmp/public-admin.headers -w '%{http_code}' "${BASE}/admin")
          test "$public_admin" = '308'
          grep -qi '^location: *https://admin\.rcitcs\.com/' /tmp/public-admin.headers

          mutation=$(curl -sS -o /tmp/public-admin-post.body -D /tmp/public-admin-post.headers -w '%{http_code}' -X POST "${BASE}/admin/login")
          test "$mutation" = '404'
          ! grep -qi '^location:' /tmp/public-admin-post.headers

          admin_code=$(curl -sS -o /tmp/admin.html -D /tmp/admin.headers -w '%{http_code}' "${ADMIN}/")
          test "$admin_code" = '200'
          grep -q 'Administrator sign in' /tmp/admin.html
          grep -qi '^content-type:.*text/html' /tmp/admin.headers
          grep -qi '^cache-control:.*no-store' /tmp/admin.headers
          grep -qi '^x-robots-tag:.*noindex' /tmp/admin.headers
          grep -qi '^x-frame-options: *DENY' /tmp/admin.headers
          grep -qi '^content-security-policy:' /tmp/admin.headers
          grep -qi '^strict-transport-security:' /tmp/admin.headers
          grep -qi '^x-rc-admin-environment: *production' /tmp/admin.headers

          session_code=$(curl -sS -o /tmp/admin-session.json -D /tmp/admin-session.headers -w '%{http_code}' "${ADMIN}/session")
          test "$session_code" = '401'
          grep -q '"authenticated":false' /tmp/admin-session.json
          grep -qi '^cache-control:.*no-store' /tmp/admin-session.headers

          rejected_code=$(curl -sS -o /tmp/admin-rejected.txt -w '%{http_code}' -X POST \
            -H 'Origin: https://example.invalid' \
            -d 'email=x&password=x' "${ADMIN}/login")
          test "$rejected_code" = '403'
          grep -q 'Request rejected' /tmp/admin-rejected.txt

      - name: Verify canonical aliases staging isolation and alternate-origin shutdown
        shell: bash
        run: |
          set -euo pipefail

          www_code=$(curl -sS -o /dev/null -D /tmp/www.headers -w '%{http_code}' --max-redirs 0 'https://www.rcitcs.com/careers?phase=17')
          test "$www_code" = '308'
          grep -qi '^location: *https://rcitcs\.com/careers?phase=17' /tmp/www.headers

          staging_code=$(curl -sS -o /tmp/staging.body -D /tmp/staging.headers -w '%{http_code}' 'https://admin-staging.rcitcs.com/' || true)
          test "$staging_code" = '503'
          grep -qi '^x-rc-admin-environment: *staging' /tmp/staging.headers
          grep -qi '^x-rc-admin-staging-state: *intentionally-unavailable' /tmp/staging.headers
          grep -qi '^cache-control:.*no-store' /tmp/staging.headers
          grep -qi '^x-robots-tag:.*noindex' /tmp/staging.headers

          workers_code=$(curl -sS --connect-timeout 10 -o /tmp/workers.body -w '%{http_code}' 'https://rc-it-consulting-services.rcitcservices.workers.dev/' || true)
          test "$workers_code" != '200'

      - name: Deployment ownership
        run: |
          echo 'RC IT Services CI and canonical production-domain verification passed.'
          echo 'rcitcs.com is the public authority; admin.rcitcs.com is the production-admin authority.'
          echo 'workers.dev, Vercel and raw backend URLs are not accepted production browser identities.'
