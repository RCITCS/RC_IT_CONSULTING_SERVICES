name: RC IT Services CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-it-services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run smoke tests
        run: npm test

      - name: Build optimized production assets
        run: npm run build

      - name: Verify production bundle and Cloudflare configuration
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f wrangler.jsonc
          test -f worker/index.js
          grep -q 'site-root' dist/index.html
          grep -q 'single-page-application' wrangler.jsonc
          grep -q 'rcitcservices' wrangler.jsonc
          grep -q 'serveApplication' worker/index.js

      - name: Deployment ownership
        run: |
          echo 'CI passed. Production deployment is handled by the connected Cloudflare Workers Builds Git integration.'
          echo 'Vercel remains a secondary deployment target and is not required for this CI job.'
