name: Phase 17.12 Redirect Canonical Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-redirect-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redirect-canonical:
    name: Verify redirect and canonical-host matrix
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Phase 17.12 source/runtime matrix
        run: node tests/phase17-redirect-canonical-matrix.mjs

      - name: Classify current public/admin redirect behavior
        shell: bash
        run: |
          set -euo pipefail

          public_admin=$(curl -sS -o /dev/null -D /tmp/public-admin.headers -w '%{http_code}' 'https://rcitcs.com/admin?from=matrix')
          test "$public_admin" = '308'
          grep -qi '^location: *https://admin\.rcitcs\.com/.*from=matrix' /tmp/public-admin.headers

          mutation=$(curl -sS -o /dev/null -D /tmp/public-admin-post.headers -w '%{http_code}' -X POST 'https://rcitcs.com/admin/login')
          test "$mutation" = '404'
          ! grep -qi '^location:' /tmp/public-admin-post.headers

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo 'PR activation state: production-admin legacy /admin canonicalization is source-verified and will be required live after the production Worker receives main.'
          else
            if ! getent ahosts admin.rcitcs.com >/dev/null 2>&1; then
              echo 'admin.rcitcs.com is unresolved on final main.' >&2
              exit 1
            fi
            legacy=$(curl -sS -o /dev/null -D /tmp/admin-legacy.headers -w '%{http_code}' 'https://admin.rcitcs.com/admin')
            test "$legacy" = '308'
            grep -qi '^location: *https://admin\.rcitcs\.com/' /tmp/admin-legacy.headers
          fi

      - name: Verify final-main canonical host matrix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          http_apex=$(curl -sS -o /dev/null -D /tmp/http-apex.headers -w '%{http_code}' --max-redirs 0 'http://rcitcs.com/careers?from=matrix' || true)
          echo "HTTP apex redirect status: ${http_apex}"
          case "$http_apex" in
            301|308) ;;
            *)
              echo "Expected a permanent HTTP-to-HTTPS redirect (301 or 308), got ${http_apex}." >&2
              cat /tmp/http-apex.headers >&2 || true
              exit 1
              ;;
          esac
          grep -qi '^location: *https://rcitcs\.com/careers?from=matrix' /tmp/http-apex.headers || {
            echo 'HTTP apex redirect did not preserve the exact canonical HTTPS destination.' >&2
            cat /tmp/http-apex.headers >&2
            exit 1
          }

          www=$(curl -sS -o /dev/null -D /tmp/www.headers -w '%{http_code}' --max-redirs 0 'https://www.rcitcs.com/services?from=matrix')
          echo "WWW canonical redirect status: ${www}"
          test "$www" = '308'
          grep -qi '^location: *https://rcitcs\.com/services?from=matrix' /tmp/www.headers

          final=$(curl -L -sS -o /tmp/www-final.body -w '%{http_code} %{url_effective}' 'http://www.rcitcs.com/careers?from=matrix')
          echo "Final canonical careers response: ${final}"
          [[ "$final" == 200\ https://rcitcs.com/careers?from=matrix ]]
          grep -q 'id="main-content"' /tmp/www-final.body || {
            echo 'Canonical careers response is missing the approved main-content structural marker.' >&2
            exit 1
          }
          grep -q 'data-prerendered-path="/careers"' /tmp/www-final.body || {
            echo 'Canonical careers response is missing the /careers prerendered-path marker.' >&2
            exit 1
          }

          admin_legacy=$(curl -sS -o /dev/null -D /tmp/admin-legacy-final.headers -w '%{http_code}' 'https://admin.rcitcs.com/admin')
          echo "Production admin legacy redirect status: ${admin_legacy}"
          test "$admin_legacy" = '308'
          grep -qi '^location: *https://admin\.rcitcs\.com/' /tmp/admin-legacy-final.headers
          grep -qi '^x-rc-admin-environment: *production' /tmp/admin-legacy-final.headers

          staging=$(curl -sS -o /tmp/staging.body -D /tmp/staging.headers -w '%{http_code}' 'https://admin-staging.rcitcs.com/' || true)
          echo "Admin staging isolation status: ${staging}"
          test "$staging" = '503'
          grep -qi '^x-rc-admin-environment: *staging' /tmp/staging.headers
          grep -qi '^x-rc-admin-staging-state: *intentionally-unavailable' /tmp/staging.headers

      - name: Phase 17.12 acceptance
        run: |
          echo 'Phase 17.12 redirect and canonical-host matrix: PASS'
